name: s217 governed read app audit
run-name: s217 governed read app audit ${{ inputs.probe_nonce }}

on:
  workflow_dispatch:
    inputs:
      probe_nonce:
        description: Non-secret nonce binding this probe invocation
        required: true
        type: string
      provision_rea:
        description: Provision the App pair into research_enforcement_activation repository secrets
        required: true
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: rea-write-enforcement-issuer
    env:
      PROBE_NONCE: ${{ inputs.probe_nonce }}
      PROVISION_REA: ${{ inputs.provision_rea }}
      GOVML_REA_READ_APP_ID: ${{ secrets.GOVML_REA_READ_APP_ID }}
      GOVML_REA_READ_APP_PRIVATE_KEY_B64: ${{ secrets.GOVML_REA_READ_APP_PRIVATE_KEY_B64 }}
      REA_SECRETS_WRITE_PAT: ${{ secrets.REA_SECRETS_WRITE_PAT }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Audit App installation permissions without disclosure
        run: |
          set -euo pipefail
          case "$PROBE_NONCE" in s217-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;; *) echo "REFUSE(PROBE_NONCE_REFUSED)" >&2; exit 2 ;; esac
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          import importlib.util

          path = Path(".github/write-enforcement/github_app_installation_token.py")
          spec = importlib.util.spec_from_file_location("governed_read_minter", path)
          if spec is None or spec.loader is None:
              print("REFUSE(MINTER_LOAD_REFUSED)", file=sys.stderr)
              raise SystemExit(2)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          app_id, key = module._credentials()
          jwt = module._sign_jwt(app_id, key)
          required = {"contents": "read"}
          rows = []
          for repository in ("research_enforcement_activation", "govML", "rexcoleman.dev"):
              value = module._api("GET", f"/repos/{module.OWNER}/{repository}/installation", jwt)
              permissions = value.get("permissions")
              if not isinstance(permissions, dict):
                  print("REFUSE(APP_PERMISSION_RESPONSE_INVALID)", file=sys.stderr)
                  raise SystemExit(2)
              delta = {
                  "missing": sorted(name for name, level in required.items() if permissions.get(name) != level),
                  "extra": sorted(name for name, level in permissions.items() if name not in required or level != "read"),
              }
              rows.append({
                  "app_id": app_id,
                  "repository": f"{module.OWNER}/{repository}",
                  "installation_id": value.get("id"),
                  "permissions": permissions,
                  "ci_required_permissions": required,
                  "permission_delta": delta,
              })
          for row in rows:
              print("S217_APP_PERMISSION " + json.dumps(row, sort_keys=True))
          token = module.mint_and_verify()
          print("::add-mask::" + token)
          print("S217_APP_TOKEN_PROBE repository_count=%d contents=read token=MASKED" % len(module.REQUIRED_REPOSITORIES))
          PY
      - name: Provision REA repository App secrets
        if: ${{ inputs.provision_rea }}
        env:
          GH_TOKEN: ${{ secrets.REA_SECRETS_WRITE_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${REA_SECRETS_WRITE_PAT:-}" ]]; then
            echo "REFUSE(REA_SECRETS_WRITE_PAT_ABSENT)" >&2
            exit 2
          fi
          gh secret set GOVML_REA_READ_APP_ID --repo rexcoleman/research_enforcement_activation --body "${GOVML_REA_READ_APP_ID}"
          gh secret set GOVML_REA_READ_APP_PRIVATE_KEY_B64 --repo rexcoleman/research_enforcement_activation --body "${GOVML_REA_READ_APP_PRIVATE_KEY_B64}"
          unset GOVML_REA_READ_APP_PRIVATE_KEY_B64
          gh secret list --repo rexcoleman/research_enforcement_activation --json name,updatedAt \
            --jq '.[] | select(.name == "GOVML_REA_READ_APP_ID" or .name == "GOVML_REA_READ_APP_PRIVATE_KEY_B64") | "S217_REA_SECRET_SET name=\(.name) updatedAt=\(.updatedAt)"'
