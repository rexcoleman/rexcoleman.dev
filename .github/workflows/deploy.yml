name: Deploy Hugo site to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact protected-main commit to deploy
        required: true
        type: string
      dispatch_nonce:
        description: Reserved BLG-10 attempt nonce
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      checked_sha: ${{ steps.exact.outputs.checked_sha }}
    steps:
      - name: Assert exact dispatch boundary
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "rexcoleman/rexcoleman.dev" ]]
          [[ "$EVENT_REF" == "refs/heads/main" ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVENT_SHA" == "$TARGET_SHA" ]]
          [[ "$DISPATCH_NONCE" =~ ^[A-Za-z0-9._:-]{16,128}$ ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.target_sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checked-out main commit
        id: exact
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          checked_sha="$(git rev-parse HEAD)"
          [[ "$checked_sha" == "$TARGET_SHA" ]]
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
          printf 'checked_sha=%s\n' "$checked_sha" >> "$GITHUB_OUTPUT"
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: '0.147.6'
          extended: true
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Write exact deployment receipt
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          CHECKED_SHA: ${{ needs.build.outputs.checked_sha }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" == "$CHECKED_SHA" ]]
          python3 -c 'import json,os,pathlib; pathlib.Path("deploy-receipt.json").write_text(json.dumps({"schema_version":"rea.c3.rex.deploy-receipt.v1","repository":os.environ["REPOSITORY"],"run_id":int(os.environ["RUN_ID"]),"run_attempt":int(os.environ["RUN_ATTEMPT"]),"target_sha":os.environ["TARGET_SHA"],"checked_out_sha":os.environ["CHECKED_SHA"],"deployed_sha":os.environ["CHECKED_SHA"],"dispatch_nonce":os.environ["DISPATCH_NONCE"],"page_url":os.environ["PAGE_URL"],"deployment_status":"success"},sort_keys=True,separators=(",",":"))+"\\n",encoding="utf-8")'
      - name: Upload exact deployment receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rex-deploy-receipt-${{ github.run_id }}
          path: deploy-receipt.json
          if-no-files-found: error
          retention-days: 30
