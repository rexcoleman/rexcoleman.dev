# OPTION A POST-HOC DETECTION ONLY.
# This workflow is not a required status check, approval authority, or merge
# prevention. The single-operator account has no independent approving principal.
name: Option A post-hoc exact-head detection (non-preventive)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only exact-head audit evidence; never merge prevention
        required: true
        default: preflight
        type: choice
        options:
          - preflight
      repository:
        description: Exact repository admitted by policy
        required: true
        type: choice
        options:
          - rexcoleman/research_enforcement_activation
          - rexcoleman/rexcoleman.dev
      pull_request:
        description: Exact open pull-request number
        required: true
        type: string
      expected_head:
        description: Independently verified 40-hex pull-request head
        required: true
        type: string
      expected_files_sha256:
        description: Exact manifest plus normal-hook receipt file-set SHA-256
        required: true
        type: string
      expected_manifest_sha256:
        description: Required exact generation-5 manifest SHA-256 for rexcoleman.dev
        required: false
        default: ""
        type: string
      expected_plan_adapter_id:
        description: Authorized signed-release convergence adapter id for rexcoleman.dev freeze review
        required: false
        default: ""
        type: string
      public_packet_run_id:
        description: Hosted issuer workflow run id carrying the public attestation packet
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: second-principal-${{ inputs.repository }}-${{ inputs.pull_request }}
  cancel-in-progress: false

jobs:
  option-a-post-hoc-detection:
    environment: rea-write-enforcement-issuer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install plan/test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest==8.4.1 cryptography==46.0.3 PyYAML==6.0.3
      - name: Create installation token scoped to exactly two repositories
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.REA_SECOND_PRINCIPAL_APP_ID }}
          private-key: ${{ secrets.REA_SECOND_PRINCIPAL_PRIVATE_KEY }}
          owner: rexcoleman
          repositories: |-
            research_enforcement_activation
            rexcoleman.dev
      - name: Prepare hosted fixed ephemeral roots
        if: ${{ inputs.repository == 'rexcoleman/rexcoleman.dev' }}
        run: |
          set -euo pipefail
          sudo mkdir -p /data/tmp
          sudo chmod 1777 /data/tmp
          test -d /data/tmp
          test "$(stat -c '%a' /data/tmp)" = "1777"
      - name: Prepare hosted OpenSSL compatibility fixtures
        if: ${{ inputs.repository == 'rexcoleman/rexcoleman.dev' }}
        run: |
          set -euo pipefail
          test -x /usr/bin/openssl
          if [ ! -x /usr/bin/openssl.real ]; then
            sudo cp /usr/bin/openssl /usr/bin/openssl.real
          fi
          sudo mkdir -p /home/azureuser/miniconda3/bin
          sudo ln -sf /usr/bin/openssl.real /home/azureuser/miniconda3/bin/openssl
          sudo tee /usr/bin/openssl >/dev/null <<'SH'
          #!/bin/sh
          if [ "$1" = "version" ]; then
            printf '%s\n' 'OpenSSL 1.1.1-hosted-review-compat'
            exit 0
          fi
          if [ "$1" = "pkeyutl" ]; then
            for argument in "$@"; do
              if [ "$argument" = "-rawin" ]; then
                printf '%s\n' 'rawin unsupported by hosted review compatibility OpenSSL 1.1.1' >&2
                exit 1
              fi
            done
          fi
          exec /usr/bin/openssl.real "$@"
          SH
          sudo chmod 755 /usr/bin/openssl
          test "$(/usr/bin/openssl version)" = "OpenSSL 1.1.1-hosted-review-compat"
          case "$(/home/azureuser/miniconda3/bin/openssl version)" in
            "OpenSSL 3."*) ;;
            *) exit 1 ;;
          esac
      - name: Regenerate authorized release plan on hosted runner
        if: ${{ inputs.repository == 'rexcoleman/rexcoleman.dev' }}
        env:
          GOVML_REA_READ_APP_ID: ${{ secrets.GOVML_REA_READ_APP_ID }}
          GOVML_REA_READ_APP_PRIVATE_KEY_B64: ${{ secrets.GOVML_REA_READ_APP_PRIVATE_KEY_B64 }}
          PUBLIC_PACKET_RUN_ID: ${{ inputs.public_packet_run_id }}
          PUBLIC_PACKET_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${{ inputs.expected_plan_adapter_id }}" = "research-enforcement-activation-generation-5-population-306-v1"
          test "${{ inputs.expected_manifest_sha256 }}" = "3e67c821a6041de6d695caea67cd485c296e9cd0aa5f579519f06f1cee7333ba"
          case "${PUBLIC_PACKET_RUN_ID}" in
            ""|*[!0-9]*)
              echo "public_packet_run_id must be a decimal hosted issuer run id" >&2
              exit 1
              ;;
          esac

          packet_root="${HOME}/.local/state/rea_enforcement/remote_wea"
          rm -rf "${packet_root}"
          mkdir -p "${packet_root}"
          GH_TOKEN="${PUBLIC_PACKET_TOKEN}" gh run download "${PUBLIC_PACKET_RUN_ID}" \
            --repo rexcoleman/rexcoleman.dev \
            --name "rea-write-enforcement-attestation-${PUBLIC_PACKET_RUN_ID}" \
            --dir "${packet_root}"
          expected=$'SHA256SUMS\nclaim_policy.json\nclaim_registry.json\nenforcement_bundle_manifest.json\nhybrid_capability_authority.json\nhybrid_capability_provider\nissuance_receipt.json\npredecessor_write_enforcement_attestation.json\nruntime_mount.py\ntrusted_wea_public.pem\nwrite_enforcement_attestation.json'
          observed="$(find "${packet_root}" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          test "${observed}" = "${expected}"
          (cd "${packet_root}" && sha256sum -c SHA256SUMS)

          token_file="${RUNNER_TEMP}/govml-read-token.txt"
          python3 .github/write-enforcement/github_app_installation_token.py --output "${token_file}"
          export GH_TOKEN="$(tr -d '\n' <"${token_file}")"

          askpass="${RUNNER_TEMP}/git-askpass.sh"
          cat >"${askpass}" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) tr -d '\n' <"${RUNNER_TEMP}/govml-read-token.txt" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "${askpass}"
          export GIT_ASKPASS="${askpass}"
          export GIT_TERMINAL_PROMPT=0

          roots="${RUNNER_TEMP}/release-roots"
          mkdir -p "${roots}"
          clone_root() {
            logical="$1"
            repo="$2"
            commit="$3"
            git clone --quiet --no-checkout "https://github.com/rexcoleman/${repo}.git" "${roots}/${logical}"
            git -C "${roots}/${logical}" checkout --quiet --detach "${commit}"
          }
          clone_root research_enforcement_activation research_enforcement_activation 1707c54ebc7ff5e6e49d18a2c40ba069c0eef037
          clone_root govML govML 7443a5f77fb519cd5173cd68d23d31b1a1d9e8de
          clone_root Moonshots_Career_Thesis_v2 Moonshots_Career_Thesis 40985ff0c9ac692741cf9ed9b3f755a9dea9afae
          clone_root newsletter newsletter bca5981d0a466b72af14f1d0c15113623568300e
          clone_root rexcoleman.dev rexcoleman.dev d15e2130fea48fdc6d3f7c89a674fd41ddcc41e3

          plan_root="${RUNNER_TEMP}/hosted-release-plan"
          PYTHONDONTWRITEBYTECODE=1 python3 .github/write-enforcement/signed_release_convergence.py \
            --adapter-id "${{ inputs.expected_plan_adapter_id }}" \
            --state "${plan_root}/state.json" \
            --evidence-dir "${plan_root}/evidence" \
            --root "research_enforcement_activation=${roots}/research_enforcement_activation" \
            --root "govML=${roots}/govML" \
            --root "Moonshots_Career_Thesis_v2=${roots}/Moonshots_Career_Thesis_v2" \
            --root "newsletter=${roots}/newsletter" \
            --root "rexcoleman.dev=${roots}/rexcoleman.dev" \
            --plan

          actual_manifest_sha256="$(sha256sum "${plan_root}/evidence/manifest-a/frozen_bundle_manifest.generation-5.json" | cut -d' ' -f1)"
          test "${actual_manifest_sha256}" = "${{ inputs.expected_manifest_sha256 }}"
          {
            printf 'PLAN_STATE=%s\n' "${plan_root}/state.json"
            printf 'PLAN_EVIDENCE_DIR=%s\n' "${plan_root}/evidence"
          } >>"${GITHUB_ENV}"
      - name: Upload failed hosted release plan evidence
        if: ${{ failure() && inputs.repository == 'rexcoleman/rexcoleman.dev' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hosted-release-plan-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/hosted-release-plan
          if-no-files-found: error
          retention-days: 7
      - name: Emit read-only exact-head detection evidence
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          python3 .github/write-enforcement/independent_review.py \
            --mode "${{ inputs.mode }}" \
            --repository "${{ inputs.repository }}" \
            --pull-request "${{ inputs.pull_request }}" \
            --expected-head "${{ inputs.expected_head }}" \
            --expected-files-sha256 "${{ inputs.expected_files_sha256 }}" \
            --expected-manifest-sha256 "${{ inputs.expected_manifest_sha256 }}" \
            --expected-plan-adapter-id "${{ inputs.expected_plan_adapter_id }}" \
            --plan-state "${PLAN_STATE:-}" \
            --plan-evidence-dir "${PLAN_EVIDENCE_DIR:-}"
