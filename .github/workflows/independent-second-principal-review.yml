# OPTION A POST-HOC DETECTION ONLY.
# This workflow is not a required status check, approval authority, or merge
# prevention. The single-operator account has no independent approving principal.
name: Option A post-hoc exact-head detection (non-preventive)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only exact-head audit evidence; never merge prevention
        required: true
        default: preflight
        type: choice
        options:
          - preflight
      repository:
        description: Exact repository admitted by policy
        required: true
        type: choice
        options:
          - rexcoleman/research_enforcement_activation
          - rexcoleman/rexcoleman.dev
      pull_request:
        description: Exact open pull-request number
        required: true
        type: string
      expected_head:
        description: Independently verified 40-hex pull-request head
        required: true
        type: string
      expected_files_sha256:
        description: Exact manifest plus normal-hook receipt file-set SHA-256
        required: true
        type: string
      expected_manifest_sha256:
        description: Required exact generation-5 manifest SHA-256 for rexcoleman.dev
        required: false
        default: ""
        type: string
      expected_plan_adapter_id:
        description: Authorized signed-release convergence adapter id for rexcoleman.dev freeze review
        required: false
        default: ""
        type: string
      release_evidence_branch:
        description: Non-default branch carrying unchanged local release plan evidence
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: second-principal-${{ inputs.repository }}-${{ inputs.pull_request }}
  cancel-in-progress: false

jobs:
  option-a-post-hoc-detection:
    environment: rea-write-enforcement-issuer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install plan/test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest==8.4.1 cryptography==46.0.3 PyYAML==6.0.3
      - name: Create installation token scoped to exactly two repositories
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.REA_SECOND_PRINCIPAL_APP_ID }}
          private-key: ${{ secrets.REA_SECOND_PRINCIPAL_PRIVATE_KEY }}
          owner: rexcoleman
          repositories: |-
            research_enforcement_activation
            rexcoleman.dev
      - name: Verify published release plan evidence branch
        if: ${{ inputs.repository == 'rexcoleman/rexcoleman.dev' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_EVIDENCE_BRANCH: ${{ inputs.release_evidence_branch }}
        run: |
          set -euo pipefail
          test "${{ inputs.expected_plan_adapter_id }}" = "research-enforcement-activation-generation-5-population-306-v1"
          test "${{ inputs.expected_manifest_sha256 }}" = "3e67c821a6041de6d695caea67cd485c296e9cd0aa5f579519f06f1cee7333ba"
          case "${RELEASE_EVIDENCE_BRANCH}" in
            release-evidence/pop306-*) ;;
            *) echo "release_evidence_branch must be a non-default pop306 evidence branch" >&2; exit 1 ;;
          esac

          token_file="${RUNNER_TEMP}/second-principal-token.txt"
          printf '%s' "${GH_TOKEN}" >"${token_file}"
          chmod 600 "${token_file}"
          askpass="${RUNNER_TEMP}/git-askpass.sh"
          cat >"${askpass}" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) tr -d '\n' <"${RUNNER_TEMP}/second-principal-token.txt" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "${askpass}"
          export GIT_ASKPASS="${askpass}"
          export GIT_TERMINAL_PROMPT=0

          evidence_checkout="${RUNNER_TEMP}/release-evidence-repo"
          git clone --quiet --depth 1 --branch "${RELEASE_EVIDENCE_BRANCH}" \
            https://github.com/rexcoleman/rexcoleman.dev.git "${evidence_checkout}"
          evidence_leaf="${RELEASE_EVIDENCE_BRANCH#release-evidence/}"
          published="${evidence_checkout}/release-evidence/${evidence_leaf}"
          test -f "${published}/unit1_pop306_protected_state.json"
          test -d "${published}/unit1_pop306_protected"
          test "$(sha256sum "${published}/unit1_pop306_protected_state.json" | cut -d' ' -f1)" = "dd28ab10f72b5dd076c632758eb714189941b952a4b1a8d205455d9c94b45400"
          test "$(sha256sum "${published}/unit1_pop306_protected/summary.json" | cut -d' ' -f1)" = "32a71bedebaf93758e58a3a535efc75b08d383c72df574fc5459584f2f831093"
          test "$(sha256sum "${published}/unit1_pop306_protected/manifest-a/frozen_bundle_manifest.generation-5.json" | cut -d' ' -f1)" = "${{ inputs.expected_manifest_sha256 }}"
          test "$(sha256sum "${published}/unit1_pop306_protected/manifest-b/frozen_bundle_manifest.generation-5.json" | cut -d' ' -f1)" = "${{ inputs.expected_manifest_sha256 }}"

          sudo mkdir -p /data/s256_branch_c_durable/evidence
          test ! -e /data/s256_branch_c_durable/evidence/unit1_pop306_protected_state.json
          test ! -e /data/s256_branch_c_durable/evidence/unit1_pop306_protected
          sudo cp -a "${published}/unit1_pop306_protected_state.json" \
            /data/s256_branch_c_durable/evidence/unit1_pop306_protected_state.json
          sudo cp -a "${published}/unit1_pop306_protected" \
            /data/s256_branch_c_durable/evidence/unit1_pop306_protected
          sudo chown -R "$(id -u):$(id -g)" /data/s256_branch_c_durable/evidence

          {
            printf 'PLAN_STATE=%s\n' /data/s256_branch_c_durable/evidence/unit1_pop306_protected_state.json
            printf 'PLAN_EVIDENCE_DIR=%s\n' /data/s256_branch_c_durable/evidence/unit1_pop306_protected
          } >>"${GITHUB_ENV}"
      - name: Upload failed release evidence branch checkout
        if: ${{ failure() && inputs.repository == 'rexcoleman/rexcoleman.dev' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-branch-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/release-evidence-repo
          if-no-files-found: ignore
          retention-days: 7
      - name: Emit read-only exact-head detection evidence
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          python3 .github/write-enforcement/independent_review.py \
            --mode "${{ inputs.mode }}" \
            --repository "${{ inputs.repository }}" \
            --pull-request "${{ inputs.pull_request }}" \
            --expected-head "${{ inputs.expected_head }}" \
            --expected-files-sha256 "${{ inputs.expected_files_sha256 }}" \
            --expected-manifest-sha256 "${{ inputs.expected_manifest_sha256 }}" \
            --expected-plan-adapter-id "${{ inputs.expected_plan_adapter_id }}" \
            --plan-state "${PLAN_STATE:-}" \
            --plan-evidence-dir "${PLAN_EVIDENCE_DIR:-}"
