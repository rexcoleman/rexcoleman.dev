name: Issue non-expiring enforcement packet
run-name: Non-expiring WEA packet

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/issue-non-expiring-enforcement-packet.yml"
      - ".github/write-enforcement/non_expiring_enforcement.py"
      - ".github/write-enforcement/frozen_bundle_manifest.generation-5.json"
      - ".github/write-enforcement/trusted_wea_public.pem"

permissions:
  contents: write

concurrency:
  group: rea-non-expiring-enforcement-packet
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  issue:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: rea-write-enforcement-issuer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Refuse non-protected ref
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "rexcoleman/rexcoleman.dev"
          test "${GITHUB_REF}" = "refs/heads/main"
      - name: Materialize protected signing key
        env:
          WEA_KEY_B64: ${{ secrets.REA_WEA_ED25519_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$WEA_KEY_B64"
          umask 077
          printf '%s' "$WEA_KEY_B64" | base64 --decode > "$RUNNER_TEMP/wea-private.pem"
      - name: Issue non-expiring packet
        run: |
          set -euo pipefail
          version="rea-non-expiring-${GITHUB_SHA}"
          report_dir="$RUNNER_TEMP/non-expiring-reports"
          mkdir -p "$report_dir"
          python3 .github/write-enforcement/non_expiring_enforcement.py issue \
            --repo-root . \
            --source-manifest .github/write-enforcement/frozen_bundle_manifest.generation-5.json \
            --private-key "$RUNNER_TEMP/wea-private.pem" \
            --trusted-public-key .github/write-enforcement/trusted_wea_public.pem \
            --output non-expiring-packet \
            --repository "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF" \
            --packet-version "$version" \
            | tee "$report_dir/non-expiring-issue-report.json"
          python3 .github/write-enforcement/non_expiring_enforcement.py verify \
            --packet-root non-expiring-packet \
            --trusted-public-key .github/write-enforcement/trusted_wea_public.pem \
            | tee "$report_dir/non-expiring-verify-report.json"
          (cd non-expiring-packet && sha256sum -c SHA256SUMS)
      - name: Prove artifact has public custody only
        run: |
          set -euo pipefail
          expected=$'SHA256SUMS\nenforcement_packet.json\nrevocations.json\ntrusted_wea_public.pem'
          observed="$(find non-expiring-packet -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          test "$observed" = "$expected"
          while IFS= read -r name; do
            test ! non-expiring-packet/"$name" -ef "$RUNNER_TEMP/wea-private.pem"
            if cmp -s non-expiring-packet/"$name" "$RUNNER_TEMP/wea-private.pem"; then
              echo "private signing key copied into artifact: $name" >&2
              exit 1
            fi
            if grep -aEq -- '-----BEGIN ([A-Z0-9]+ )*PRIVATE KEY-----' non-expiring-packet/"$name"; then
              echo "private PEM material present in artifact: $name" >&2
              exit 1
            fi
          done <<< "$observed"
          echo "NON_EXPIRING_PUBLIC_ONLY_ARTIFACT_PASS files=4"
      - name: Select the governed read credential under custody precedence
        id: governed_read
        env:
          GOVML_REA_READ_APP_ID: ${{ secrets.GOVML_REA_READ_APP_ID }}
          GOVML_REA_READ_APP_PRIVATE_KEY_B64: ${{ secrets.GOVML_REA_READ_APP_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          umask 077
          python3 .github/write-enforcement/select_governed_read_credential.py \
            --minter .github/write-enforcement/github_app_installation_token.py \
            --output "$RUNNER_TEMP/governed-read-credential"
          test "$(stat -c '%a' "$RUNNER_TEMP/governed-read-credential")" = 600
          credential="$(cat "$RUNNER_TEMP/governed-read-credential")"
          echo "::add-mask::$credential"
          printf 'token=%s\n' "$credential" >> "$GITHUB_OUTPUT"
      - name: End-to-end birth proof before publish
        env:
          GH_TOKEN: ${{ steps.governed_read.outputs.token }}
        run: |
          set -euo pipefail
          birth_scratch="/tmp/non-expiring-birth-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$birth_scratch"
          mkdir -p "$birth_scratch"
          python3 .github/write-enforcement/non_expiring_birth_e2e.py \
            --mode candidate \
            --site-root . \
            --source-manifest .github/write-enforcement/frozen_bundle_manifest.generation-5.json \
            --scratch-root "$birth_scratch" \
            --remote-kind local \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --max-rehearsal-repos 20 \
            --max-runtime-seconds 3600 \
            --report "$RUNNER_TEMP/non-expiring-birth-e2e-report.json"
      - name: Verify birth proof matches issued packet
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/non-expiring-reports/non-expiring-issue-report.json" "$RUNNER_TEMP/non-expiring-birth-e2e-report.json" <<'PY'
          import json
          import sys
          issue = json.load(open(sys.argv[1], encoding="utf-8"))
          receipt = json.load(open(sys.argv[2], encoding="utf-8"))
          if receipt.get("schema_version") != "rea.non_expiring_birth_gate.receipt.v1":
              raise SystemExit("birth receipt schema mismatch")
          if receipt.get("mode") != "candidate":
              raise SystemExit("birth receipt mode mismatch")
          if issue.get("protected_default_commit") != receipt.get("site_commit"):
              raise SystemExit("birth receipt protected-default commit mismatch")
          if issue.get("source_manifest_digest") != receipt.get("source_manifest_sha256"):
              raise SystemExit("birth receipt manifest byte digest mismatch")
          if receipt.get("research_types") != ["build", "synthesis", "computational", "write_publish"]:
              raise SystemExit("birth receipt did not cover all research types")
          rows = receipt.get("types")
          if not isinstance(rows, list) or len(rows) != 4:
              raise SystemExit("birth receipt type rows missing")
          for row in rows:
              if row.get("scaffold_rc") != 0 or row.get("honest_gate_rc") != 0:
                  raise SystemExit(f"birth receipt honest path failed: {row.get('research_type')}")
              if row.get("planted_gate_rc") == 0:
                  raise SystemExit(f"birth receipt planted path passed: {row.get('research_type')}")
              archive = row.get("archive") or {}
              if archive.get("archived") is not True:
                  raise SystemExit(f"birth receipt repo not archived: {row.get('research_type')}")
          print("NON_EXPIRING_BIRTH_RECEIPT_MATCH_PASS")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rea-non-expiring-enforcement-packet-${{ github.run_id }}
          path: |
            non-expiring-packet/
            ${{ runner.temp }}/non-expiring-reports/non-expiring-issue-report.json
            ${{ runner.temp }}/non-expiring-reports/non-expiring-verify-report.json
            ${{ runner.temp }}/non-expiring-birth-e2e-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish release packet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="rea-non-expiring-enforcement-${GITHUB_SHA:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              non-expiring-packet/enforcement_packet.json \
              non-expiring-packet/revocations.json \
              non-expiring-packet/trusted_wea_public.pem \
              non-expiring-packet/SHA256SUMS \
              --clobber
          else
            gh release create "$tag" \
              non-expiring-packet/enforcement_packet.json \
              non-expiring-packet/revocations.json \
              non-expiring-packet/trusted_wea_public.pem \
              non-expiring-packet/SHA256SUMS \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --notes "Automated non-expiring REA enforcement packet for ${GITHUB_SHA}." \
              --latest
          fi
