name: signed-release-convergence

on:
  pull_request:
    paths:
      - ".github/workflows/signed-release-convergence.yml"
      - ".github/write-enforcement/SIGNED_RELEASE_CONVERGENCE.md"
      - ".github/write-enforcement/SIGNED_RELEASE_CONVERGENCE_INDEX.md"
      - ".github/write-enforcement/adapters/**"
      - ".github/write-enforcement/signed_release_convergence_index.json"
      - ".github/write-enforcement/signed_release_convergence.py"
      - ".github/write-enforcement/build_frozen_manifest.py"
      - ".github/write-enforcement/member_contract.py"
      - ".github/write-enforcement/tests/test_signed_release_convergence.py"
      - ".github/write-enforcement/tests/test_build_frozen_manifest.py"
      - ".github/write-enforcement/tests/test_member_contract.py"
      - ".github/write-enforcement/tests/test_s131_convergence.py"
      - ".github/write-enforcement/tests/test_s132_staged_domain.py"
      - "tests/test_s111_signed_runtime_members.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/signed-release-convergence.yml"
      - ".github/write-enforcement/SIGNED_RELEASE_CONVERGENCE.md"
      - ".github/write-enforcement/SIGNED_RELEASE_CONVERGENCE_INDEX.md"
      - ".github/write-enforcement/adapters/**"
      - ".github/write-enforcement/signed_release_convergence_index.json"
      - ".github/write-enforcement/signed_release_convergence.py"
      - ".github/write-enforcement/build_frozen_manifest.py"
      - ".github/write-enforcement/member_contract.py"
      - ".github/write-enforcement/tests/test_signed_release_convergence.py"
      - ".github/write-enforcement/tests/test_build_frozen_manifest.py"
      - ".github/write-enforcement/tests/test_member_contract.py"
      - ".github/write-enforcement/tests/test_s131_convergence.py"
      - ".github/write-enforcement/tests/test_s132_staged_domain.py"
      - "tests/test_s111_signed_runtime_members.py"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compile with system Python
        run: python3 -m py_compile .github/write-enforcement/signed_release_convergence.py
      - name: Run internal refusal matrix
        run: PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 .github/write-enforcement/signed_release_convergence.py --self-test
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install pinned test runner
        run: >-
          python -m pip install --disable-pip-version-check
          pytest==8.4.1 cryptography==46.0.3 PyYAML==6.0.3
      - name: Run focused tests
        env:
          PYTHONPATH: .github/write-enforcement
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -q
          .github/write-enforcement/tests/test_signed_release_convergence.py
          .github/write-enforcement/tests/test_build_frozen_manifest.py
          .github/write-enforcement/tests/test_member_contract.py
          .github/write-enforcement/tests/test_s131_convergence.py
          .github/write-enforcement/tests/test_s132_staged_domain.py
          tests/test_s111_signed_runtime_members.py
