name: Issue external judge authority
run-name: External judge authority ${{ inputs.request_sha256 }}

on:
  workflow_dispatch:
    inputs:
      request_b64:
        description: Base64 of the exact non-secret create-request bytes
        required: true
        type: string
      request_sha256:
        description: SHA-256 of the exact decoded create-request bytes
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: govml-external-judge-approver
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  issue:
    environment: govml-external-judge-approver
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GOVML_ISSUER_COMMIT: ${{ vars.GOVML_EXTERNAL_JUDGE_ISSUER_COMMIT }}
      GOVML_ISSUER_SHA256: ${{ vars.GOVML_EXTERNAL_JUDGE_ISSUER_SHA256 }}
      GOVML_EXTERNAL_JUDGE_APPROVING_PUBLIC_KEY_SHA256: ${{ vars.GOVML_EXTERNAL_JUDGE_APPROVING_PUBLIC_KEY_SHA256 }}
      # s210: the same two governed-read modules the issuer workflow pins.
      GOVERNED_READ_MINTER_SHA256: 229ce6b172da80e092f93262fc442a1c6099811c125e44e854fc0a12269e9fcf
      GOVERNED_READ_SELECTOR_SHA256: 6668b7c1115d18a2d71bd17ceff6628163f97d4a106e4e4581f0835fb9954718
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Bind the governed read credential modules and refuse an unset issuer pin
        run: |
          set -euo pipefail
          test "$(sha256sum .github/write-enforcement/github_app_installation_token.py | cut -d' ' -f1)" = "$GOVERNED_READ_MINTER_SHA256"
          test "$(sha256sum .github/write-enforcement/select_governed_read_credential.py | cut -d' ' -f1)" = "$GOVERNED_READ_SELECTOR_SHA256"
          # The only run of this workflow (33394886672, 2026-08-31) executed
          # with all three repository variables EMPTY.  An empty ref made the
          # checkout below ask for a default branch instead of the registered
          # commit; refuse before the checkout rather than after it.
          if [[ ! "$GOVML_ISSUER_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "REFUSED GOVML_ISSUER_COMMIT_UNSET: repository variable" >&2
            echo "GOVML_EXTERNAL_JUDGE_ISSUER_COMMIT is empty or not a 40-hex" >&2
            echo "commit.  Set it, GOVML_EXTERNAL_JUDGE_ISSUER_SHA256 and" >&2
            echo "GOVML_EXTERNAL_JUDGE_APPROVING_PUBLIC_KEY_SHA256 before dispatch." >&2
            exit 3
          fi
          echo "GOVERNED_READ_MODULE_PIN_PASS minter=$GOVERNED_READ_MINTER_SHA256 selector=$GOVERNED_READ_SELECTOR_SHA256"
      - name: Select the governed read credential under custody precedence
        id: governed_read
        env:
          GOVML_REA_READ_APP_ID: ${{ secrets.GOVML_REA_READ_APP_ID }}
          GOVML_REA_READ_APP_PRIVATE_KEY_B64: ${{ secrets.GOVML_REA_READ_APP_PRIVATE_KEY_B64 }}
          REA_BUNDLE_READ_TOKEN: ${{ secrets.REA_BUNDLE_READ_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          # rexcoleman/govML is private and this job's default GITHUB_TOKEN is
          # scoped to rexcoleman.dev, which is why the checkout below returned
          # "Not Found" on 2026-08-31.  Mint through the SAME custody
          # precedence the issuer workflow uses; introduce no new long-lived
          # secret name.
          python3 .github/write-enforcement/select_governed_read_credential.py \
            --minter .github/write-enforcement/github_app_installation_token.py \
            --output "$RUNNER_TEMP/governed-read-credential"
          test "$(stat -c '%a' "$RUNNER_TEMP/governed-read-credential")" = 600
          credential="$(cat "$RUNNER_TEMP/governed-read-credential")"
          echo "::add-mask::$credential"
          printf 'token=%s\n' "$credential" >> "$GITHUB_OUTPUT"
      - name: Checkout the exact registered govML issuer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: rexcoleman/govML
          ref: ${{ env.GOVML_ISSUER_COMMIT }}
          token: ${{ steps.governed_read.outputs.token }}
          path: govml
          persist-credentials: false
      - name: Remove the governed read credential before any checked-out code runs
        run: |
          set -euo pipefail
          # The next step executes govml/scripts/issue_external_judge_authority.py
          # -- checked-out code from another repository.  Custody requires the
          # credential file to be gone before that happens.
          rm -f "$RUNNER_TEMP/governed-read-credential"
          test ! -e "$RUNNER_TEMP/governed-read-credential"
          echo "GOVERNED_READ_CREDENTIAL_REMOVED=true"
      - name: Bind protected workflow and issuer source
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_REF_PROTECTED" == true ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GOVML_ISSUER_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GOVML_ISSUER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$GOVML_EXTERNAL_JUDGE_APPROVING_PUBLIC_KEY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(git -C govml rev-parse HEAD)" = "$GOVML_ISSUER_COMMIT"
          test "$(sha256sum govml/scripts/issue_external_judge_authority.py | cut -d' ' -f1)" = "$GOVML_ISSUER_SHA256"
          python3 govml/scripts/issue_external_judge_authority.py --help >/dev/null
          echo "HOSTED_ISSUER_BINDING_PASS commit=$GOVML_ISSUER_COMMIT issuer_sha256=$GOVML_ISSUER_SHA256"
      - name: Materialize exact request bytes
        env:
          REQUEST_B64: ${{ inputs.request_b64 }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, re
          expected = os.environ["REQUEST_SHA256"]
          if re.fullmatch(r"[0-9a-f]{64}", expected) is None:
              raise SystemExit("REQUEST_SHA256_REFUSED")
          try:
              raw = base64.b64decode(os.environ["REQUEST_B64"], validate=True)
              raw.decode("ascii")
          except (ValueError, UnicodeError):
              raise SystemExit("REQUEST_BYTES_REFUSED") from None
          if hashlib.sha256(raw).hexdigest() != expected:
              raise SystemExit("REQUEST_DIGEST_MISMATCH")
          pathlib.Path("request.json").write_bytes(raw)
          PY
      - name: Approve exact request with protected hosted principal
        env:
          GOVML_EXTERNAL_JUDGE_APPROVING_PRIVATE_KEY_PEM: ${{ secrets.GOVML_EXTERNAL_JUDGE_APPROVING_PRIVATE_KEY_PEM }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
        run: |
          set -euo pipefail
          test -n "$GOVML_EXTERNAL_JUDGE_APPROVING_PRIVATE_KEY_PEM"
          PYTHONDONTWRITEBYTECODE=1 python3 govml/scripts/issue_external_judge_authority.py \
            approve-request-hosted \
            --request request.json \
            --expected-request-sha256 "$REQUEST_SHA256" \
            --output external_judge_authority.json \
            --receipt hosted_issuance_receipt.json
      - name: Upload authenticated authority and receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: govml-external-judge-authority-${{ github.run_id }}
          path: |
            external_judge_authority.json
            hosted_issuance_receipt.json
          if-no-files-found: error
          retention-days: 1
