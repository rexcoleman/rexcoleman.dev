name: Probe WEA credential recovery
run-name: WEA credential probe ${{ inputs.probe_nonce }}

on:
  workflow_dispatch:
    inputs:
      probe_nonce:
        description: Non-secret nonce binding this probe invocation
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  issuer:
    runs-on: ubuntu-24.04
    environment: rea-write-enforcement-issuer
    env:
      PROBE_NONCE: ${{ inputs.probe_nonce }}
      GOVML_REA_READ_APP_ID: ${{ secrets.GOVML_REA_READ_APP_ID }}
      GOVML_REA_READ_APP_PRIVATE_KEY_B64: ${{ secrets.GOVML_REA_READ_APP_PRIVATE_KEY_B64 }}
      REA_BUNDLE_READ_TOKEN: ${{ secrets.REA_BUNDLE_READ_TOKEN }}
      REA_RULESET_READ_TOKEN: ${{ secrets.REA_RULESET_READ_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Probe issuer credentials without disclosure
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 .github/write-enforcement/s212_wea_credential_recovery.py \
            --hosted-probe issuer --probe-nonce "$PROBE_NONCE"

  renewal:
    runs-on: ubuntu-24.04
    environment: rea-write-enforcement-renewal
    env:
      PROBE_NONCE: ${{ inputs.probe_nonce }}
      GOVML_REA_READ_APP_ID: ${{ secrets.GOVML_REA_READ_APP_ID }}
      GOVML_REA_READ_APP_PRIVATE_KEY_B64: ${{ secrets.GOVML_REA_READ_APP_PRIVATE_KEY_B64 }}
      REA_BUNDLE_READ_TOKEN: ${{ secrets.REA_BUNDLE_READ_TOKEN }}
      REA_RULESET_READ_TOKEN: ${{ secrets.REA_RULESET_READ_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Probe renewal credentials without disclosure
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 .github/write-enforcement/s212_wea_credential_recovery.py \
            --hosted-probe renewal --probe-nonce "$PROBE_NONCE"

  approver:
    runs-on: ubuntu-24.04
    environment: govml-external-judge-approver
    env:
      PROBE_NONCE: ${{ inputs.probe_nonce }}
      GOVML_REA_READ_APP_ID: ${{ secrets.GOVML_REA_READ_APP_ID }}
      GOVML_REA_READ_APP_PRIVATE_KEY_B64: ${{ secrets.GOVML_REA_READ_APP_PRIVATE_KEY_B64 }}
      GOVML_EXTERNAL_JUDGE_APPROVING_PRIVATE_KEY_PEM: ${{ secrets.GOVML_EXTERNAL_JUDGE_APPROVING_PRIVATE_KEY_PEM }}
      GOVML_EXTERNAL_JUDGE_APPROVING_PUBLIC_KEY_SHA256: ${{ vars.GOVML_EXTERNAL_JUDGE_APPROVING_PUBLIC_KEY_SHA256 }}
      GOVML_EXTERNAL_JUDGE_ISSUER_COMMIT: ${{ vars.GOVML_EXTERNAL_JUDGE_ISSUER_COMMIT }}
      GOVML_EXTERNAL_JUDGE_ISSUER_SHA256: ${{ vars.GOVML_EXTERNAL_JUDGE_ISSUER_SHA256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Probe approver credentials without disclosure
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 .github/write-enforcement/s212_wea_credential_recovery.py \
            --hosted-probe approver --probe-nonce "$PROBE_NONCE"
